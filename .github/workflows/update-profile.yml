name: Update profile cards and project names
on:
  pull_request:
    branches: [master]
  push:
    branches: ['profile/**']
  workflow_dispatch:
  schedule:
    - cron: '23 7 * * *'
permissions:
  contents: read
concurrency:
  group: profile-${{ github.ref }}
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: python3 scripts/update-profile.py --check
  update:
    if: github.repository == 'Perfecto23/Perfecto23' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)))
    needs: check
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Update profile cards and project names
        id: update
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/update-profile.py
      - run: python3 scripts/update-profile.py --check
      - name: Commit generated content
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- README.md assets/ai-usage.svg assets/productive-time.svg
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update profile cards and project names [skip ci]'
          git push
      - if: steps.update.outcome == 'failure'
        run: echo 'Unavailable sources retained their previous cards and dates.' && exit 1
