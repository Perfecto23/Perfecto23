name: Generate contribution snake
on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:
  push:
    branches: [master]
permissions:
  contents: read
concurrency:
  group: contribution-snake
  cancel-in-progress: false
jobs:
  generate:
    if: github.repository == 'Perfecto23/Perfecto23' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/snake.svg?color_snake=#7dcfff&color_dots=#292e42,#6d28d9,#8b5cf6,#a78bfa,#c4b5fd
      - name: Apply fixed background
        run: |
          python3 - <<'PYCODE'
          import re
          from pathlib import Path
          from xml.etree import ElementTree as ET
          path = Path('assets/snake.svg')
          svg = path.read_text()
          root = ET.fromstring(svg)
          x, y, width, height = root.attrib['viewBox'].split()
          background = f'<rect x="{x}" y="{y}" width="{width}" height="{height}" fill="#1a1b27"/>'
          svg = re.sub(r'(<svg\b[^>]*>)', lambda m: m[1]+background, svg, count=1)
          svg = re.sub(r'--cb:#[0-9a-fA-F]+', '--cb:#414868', svg)
          ET.fromstring(svg)
          path.write_text(svg)
          PYCODE
      - name: Commit animation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- assets/snake.svg
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update contribution snake [skip ci]'
          git pull --rebase
          git push
