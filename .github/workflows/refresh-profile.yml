name: Profile cards
on:
  pull_request:
    branches: [master]
  push:
    branches: ['profile/**']
  workflow_dispatch:
  schedule:
    - cron: '23 7 * * *'
permissions:
  contents: read
concurrency:
  group: profile-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python scripts/validate.py
      - name: Check deterministic offline rendering
        run: |
          PROFILE_DATE=$(python -c "import json; print(json.load(open('sources/tokentracker-last-good.json'))['window'][1])")
          python scripts/refresh.py --as-of "$PROFILE_DATE"
          git diff --exit-code -- README.md assets preview sources
  refresh:
    # Scheduling starts only after merge. PRs and branch pushes never write.
    if: github.repository == 'Perfecto23/Perfecto23' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)))
    needs: validate
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Refresh independently and retain valid snapshots on failure
        id: refresh
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/refresh.py --fetch
      - run: python -m unittest discover -s tests -v
      - run: python scripts/validate.py
      - name: Commit public generated summaries
        env:
          PROFILE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- README.md assets preview sources/tokentracker-last-good.json sources/tokentracker-cumulative.json sources/source-status.json sources/upstream-last-good.json sources/contributions-365.json sources/image-status.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh profile data and cards [skip ci]'
          git push origin "HEAD:${PROFILE_BRANCH}"
      - name: Surface partial source failures
        if: steps.refresh.outcome == 'failure'
        run: |
          echo 'One or more sources failed; valid updates committed, failed sources retained with original capture times.'
          exit 1
